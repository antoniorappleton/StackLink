<!DOCTYPE html>
<html lang="pt">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Aroundwise — a sua biblioteca de links, organizada com elegância." />
  <meta name="theme-color" content="#0F2A3D" />
  <title>Aroundwise</title>

  <!-- PWA -->
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="./assets/favicon-32.png" sizes="32x32" type="image/png" />
  <link rel="apple-touch-icon" href="./assets/apple-touch-icon.png" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- CSS -->
  <link rel="stylesheet" href="css/style.css" />

  <!-- Scripts (Modules) -->
  <script type="module" src="js/app.js"></script>
</head>

<body>
  <div class="bg-ambient"></div>
  <div id="toast-container" class="toast-container" aria-live="polite"></div>

  <div class="app-container">

    <!-- Public Shared Stack View -->
    <section id="share-screen" class="hidden full-screen-view">
      <div class="share-card surface">
        <div class="brand-mark">
          <svg class="logo-icon" width="40" height="40" viewBox="0 0 100 100" fill="none">
            <path d="M 80.53 38.28 A 32.7 32.7 0 1 1 67.81 22.57" stroke="currentColor" stroke-width="6.6" stroke-linecap="round" />
            <circle cx="75.41" cy="29.42" r="5" fill="var(--brand-accent)" />
            <circle cx="50" cy="50" r="10.25" fill="currentColor" />
          </svg>
        </div>
        <p class="share-eyebrow" id="share-owner">Stack partilhada</p>
        <div class="share-heading">
          <span id="share-icon" class="category-icon-large"></span>
          <h1 id="share-title">A carregar…</h1>
        </div>
        <div id="share-links" class="links-grid share-links-grid"></div>
        <div class="share-actions">
          <button id="share-save-btn" class="btn btn-primary hidden">Guardar na minha conta</button>
          <a href="./" class="btn btn-secondary">Abrir o Aroundwise</a>
        </div>
      </div>
    </section>

    <!-- Auth Screen -->
    <section id="auth-screen" class="hidden full-screen-view">
      <div class="auth-card surface">
        <div class="brand-mark">
          <svg class="logo-icon" width="48" height="48" viewBox="0 0 100 100" fill="none">
            <path d="M 80.53 38.28 A 32.7 32.7 0 1 1 67.81 22.57" stroke="currentColor" stroke-width="6.6" stroke-linecap="round" />
            <circle cx="75.41" cy="29.42" r="5" fill="var(--brand-accent)" />
            <circle cx="50" cy="50" r="10.25" fill="currentColor" />
          </svg>
        </div>
        <h1>Aroundwise</h1>
        <p>Tudo o que importa, à sua volta.</p>
        <button id="login-btn" class="btn btn-primary">
          <svg width="20" height="20" viewBox="0 0 24 24">
            <path fill="currentColor"
              d="M12.545 10.239v3.821h5.445c-.712 2.315-2.647 3.972-5.445 3.972c-3.332 0-6.033-2.701-6.033-6.032s2.701-6.032 6.033-6.032c1.498 0 2.866.549 3.921 1.453l2.814-2.814C17.503 2.988 15.139 2 12.545 2C7.021 2 2.543 6.477 2.543 12s4.478 10 10.002 10c8.396 0 10.249-7.85 9.426-11.748l-9.426-.013z" />
          </svg>
          Entrar com Google
        </button>
      </div>
    </section>

    <!-- Main App Shell -->
    <div id="main-app" class="app-shell hidden">
      <div id="sidebar-overlay" class="sidebar-overlay"></div>

      <aside id="sidebar" class="sidebar">
        <div class="sidebar-brand">
          <svg class="logo-icon" width="30" height="30" viewBox="0 0 100 100" fill="none">
            <path d="M 80.53 38.28 A 32.7 32.7 0 1 1 67.81 22.57" stroke="currentColor" stroke-width="6.6" stroke-linecap="round" />
            <circle cx="75.41" cy="29.42" r="5" fill="var(--brand-accent)" />
            <circle cx="50" cy="50" r="10.25" fill="currentColor" />
          </svg>
          <span class="text">Aroundwise</span>
          <button id="sidebar-close-btn" class="btn-icon sidebar-close-btn" title="Fechar menu">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>

        <nav class="sidebar-nav">
          <button type="button" class="nav-item" data-id="all">
            <span class="nav-item-icon"></span>
            <span class="nav-item-label">Todos os Links</span>
            <span class="nav-item-count" id="count-all">0</span>
          </button>
          <button type="button" class="nav-item" data-id="favorites">
            <span class="nav-item-icon"></span>
            <span class="nav-item-label">Favoritos</span>
            <span class="nav-item-count" id="count-favorites">0</span>
          </button>

          <div class="sidebar-section-label">As Minhas Stacks</div>
          <div id="stacks-list" class="stacks-list"></div>

          <button type="button" id="add-category-btn" class="nav-add">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            Nova Stack
          </button>
        </nav>

        <div class="sidebar-footer">
          <div class="user-chip" id="user-chip">
            <span class="user-chip-name" id="user-chip-name"></span>
          </div>
          <div class="sidebar-actions">
            <button id="theme-toggle-btn" class="btn-icon" title="Alternar Tema">
              <svg class="icon-sun" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
              <svg class="icon-moon hidden" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
            </button>
            <button id="settings-btn" class="btn-icon" title="Definições">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.1a2 2 0 0 1-1-1.72v-.51a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            </button>
            <button id="logout-btn" class="btn-icon" title="Sair">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></svg>
            </button>
          </div>
        </div>
      </aside>

      <main class="main-content">
        <header class="topbar">
          <button id="sidebar-toggle-btn" class="btn-icon sidebar-toggle-btn" title="Menu">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
          </button>

          <div class="search-bar surface">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="8" /><line x1="21" x2="16.65" y1="16.65" y2="16.65" />
            </svg>
            <input type="text" id="search-input" placeholder="Pesquisar links…" />
          </div>

          <div class="topbar-actions">
            <button id="toggle-view-btn" class="btn-icon surface" title="Mudar Visualização">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
            </button>
            <button id="add-link-btn" class="btn btn-primary">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
              Novo Link
            </button>
          </div>
        </header>

        <section class="view-header">
          <div class="view-heading">
            <span id="view-icon" class="category-icon-large"></span>
            <div>
              <h1 id="view-title">Todos os Links</h1>
              <span class="view-count" id="view-count">0 itens</span>
            </div>
          </div>
          <div class="view-actions" id="view-actions">
            <button type="button" id="share-stack-btn" class="btn-icon surface hidden" title="Partilhar Stack">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
            </button>
            <button type="button" id="edit-stack-btn" class="btn-icon surface hidden" title="Editar Stack">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
            </button>
          </div>
        </section>

        <section class="links-grid" id="links-view"></section>
      </main>
    </div>
  </div>

  <!-- Add Link Dialog -->
  <dialog id="link-dialog" class="surface-dialog">
    <form method="dialog" id="link-form">
      <h2 class="dialog-title">Guardar Novo Link</h2>

      <div class="form-group">
        <label>Endereço URL</label>
        <input type="url" id="link-url" required placeholder="https://exemplo.com" />
      </div>

      <div class="link-preview hidden" id="link-preview">
        <img id="link-preview-img" alt="" />
        <div class="link-preview-info">
          <span id="link-preview-title"></span>
          <span id="link-preview-domain" class="text-muted"></span>
        </div>
      </div>

      <div class="form-group">
        <label>Título Amigável</label>
        <input type="text" id="link-title" required placeholder="Título do recurso" />
      </div>

      <div class="form-group">
        <label>Notas Rápidas</label>
        <textarea id="link-description" rows="2" placeholder="O que há de interessante aqui?"></textarea>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Stack</label>
          <select id="link-category"><option value="">Geral</option></select>
        </div>
        <div class="form-group">
          <label>Ícone Personalizado</label>
          <select id="link-icon"><option value="">Automático</option></select>
        </div>
      </div>

      <div class="form-actions">
        <button type="button" class="btn btn-secondary" onclick="this.closest('dialog').close()">Cancelar</button>
        <button type="submit" class="btn btn-primary">Guardar Link</button>
      </div>
    </form>
  </dialog>

  <!-- Add Category Dialog -->
  <dialog id="category-dialog" class="surface-dialog">
    <form method="dialog" id="category-form">
      <h2 class="dialog-title">Criar Nova Stack</h2>

      <div class="form-group">
        <label>Nome da Stack</label>
        <input type="text" id="cat-name" required placeholder="Ex: Design Inspiration, Dev Tools..." />
      </div>

      <div class="form-group">
        <label>Ícone Representativo</label>
        <select id="cat-icon"></select>
      </div>

      <div class="form-group">
        <label>Cor de Identidade</label>
        <input type="color" id="cat-color" value="#15414A" class="color-swatch-input" />
      </div>

      <div class="form-actions">
        <button type="button" class="btn btn-secondary" onclick="this.closest('dialog').close()">Cancelar</button>
        <button type="submit" class="btn btn-primary">Criar Stack</button>
      </div>
    </form>
  </dialog>

  <!-- Settings Dialog -->
  <dialog id="settings-dialog" class="surface-dialog">
    <form method="dialog" id="settings-form">
      <h2 class="dialog-title">Definições</h2>

      <div class="settings-grid">

        <div class="settings-group">
          <label class="settings-label">Modo de Cor</label>
          <div class="theme-opt-row">
            <button type="button" class="btn btn-secondary theme-opt" data-theme="light">Claro</button>
            <button type="button" class="btn btn-secondary theme-opt" data-theme="dark">Escuro</button>
          </div>
        </div>

        <div class="settings-group">
          <label class="settings-label">Cores de Destaque</label>
          <div class="color-input-row">
            <div class="color-input-wrapper surface">
              <input type="color" id="primary-color-input" value="#15414A" class="color-swatch-input">
              <span>Primária</span>
            </div>
            <div class="color-input-wrapper surface">
              <input type="color" id="secondary-color-input" value="#D9A95B" class="color-swatch-input">
              <span>Destaque</span>
            </div>
          </div>
        </div>

        <div class="settings-group">
          <div class="settings-label-row">
            <label class="settings-label">Arredondamento</label>
            <span id="radius-val" class="settings-value">16px</span>
          </div>
          <input type="range" id="radius-input" min="4" max="28" value="16" />
        </div>

        <div class="settings-group">
          <label class="settings-label">Dados</label>
          <div class="data-actions">
            <button type="button" id="export-json-btn" class="btn btn-secondary">Exportar (JSON)</button>
            <button type="button" id="export-html-btn" class="btn btn-secondary">Exportar (Marcadores)</button>
            <label class="btn btn-secondary file-input-label">
              Importar Ficheiro
              <input type="file" id="import-file-input" accept=".json,.html,.htm" class="hidden" />
            </label>
          </div>
        </div>

      </div>

      <div class="form-actions form-actions-center">
        <button type="button" class="btn btn-primary" onclick="this.closest('dialog').close()">Concluir</button>
      </div>
    </form>
  </dialog>
</body>

</html>
